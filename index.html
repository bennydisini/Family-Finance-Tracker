<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasku - Rekap Keuangan Keluarga</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Poppins for a more modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js untuk Grafik Interaktif -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Tailwind Config for Custom Colors/Fonts -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8fafc;
            background-image: radial-gradient(at 0% 0%, hsla(201,100%,94%,1) 0, transparent 50%), radial-gradient(at 100% 100%, hsla(201,100%,94%,1) 0, transparent 50%);
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Hide Scrollbar but keep functionality */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        /* Safe Area Padding for Mobile Bottom Nav */
        .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }

        /* Glassmorphism Utilities */
        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        
        /* Interactive Animations */
        .btn-press:active { transform: scale(0.95); transition: transform 0.1s; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { 
            from { transform: translateY(30px) scale(0.98); opacity: 0; } 
            to { transform: translateY(0) scale(1); opacity: 1; } 
        }

        /* Modal Transitions */
        .modal-overlay { background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal-enter { animation: modalEnter 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes modalEnter {
            from { transform: scale(0.8) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* Nav Indicator Animation */
        .nav-btn.active i { transform: translateY(-4px) scale(1.1); color: #0ea5e9; }
        .nav-btn.active span { font-weight: 600; color: #0ea5e9; }
        .nav-btn i { transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    </style>
</head>

<body class="text-slate-800 antialiased h-[100dvh] flex flex-col overflow-hidden">
    
    <!-- LOGIN VIEW -->
    <div id="loginView" class="h-full flex items-center justify-center fade-in px-4 absolute inset-0 z-50 bg-white">
        <div class="glass p-8 rounded-3xl shadow-[0_20px_50px_rgba(8,_112,_184,_0.1)] w-full max-w-md relative overflow-hidden">
            
            <!-- Decor bubbles -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-brand-400 opacity-20 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-brand-500 opacity-20 rounded-full blur-2xl"></div>

            <div class="text-center mb-10 relative z-10">
                <div class="w-20 h-20 bg-gradient-to-tr from-brand-600 to-brand-400 text-white rounded-2xl flex items-center justify-center text-4xl mx-auto mb-6 shadow-xl transform rotate-3">
                    <i class="fa-solid fa-wallet -rotate-3"></i>
                </div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Kasku</h1>
                <p class="text-slate-500 mt-2">Atur keuangan keluarga lebih cerdas</p>
            </div>
            
            <form id="loginForm" class="space-y-6 relative z-10">
                <div class="space-y-4">
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-user text-slate-400 group-focus-within:text-brand-500 transition-colors"></i>
                        </div>
                        <input type="text" id="username" required class="block w-full pl-11 pr-4 py-3.5 bg-white/50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 focus:bg-white text-sm transition-all shadow-sm" placeholder="Username (admin)">
                    </div>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-slate-400 group-focus-within:text-brand-500 transition-colors"></i>
                        </div>
                        <input type="password" id="password" required class="block w-full pl-11 pr-4 py-3.5 bg-white/50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 focus:bg-white text-sm transition-all shadow-sm" placeholder="Password (admin123)">
                    </div>
                </div>
                <button type="submit" id="btnLogin" class="btn-press w-full flex justify-center py-3.5 px-4 rounded-2xl shadow-lg shadow-brand-500/30 text-sm font-semibold text-white bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-700 hover:to-brand-600 transition-all">
                    <span>Mulai Sekarang</span>
                    <i id="loginSpinner" class="fa-solid fa-circle-notch fa-spin ml-2 hidden mt-0.5"></i>
                </button>
            </form>
            
            <div id="previewNotice" class="mt-8 p-4 bg-amber-50 rounded-2xl border border-amber-100 text-xs text-amber-700 hidden relative z-10 flex items-start gap-3">
                <i class="fa-solid fa-bolt text-amber-500 text-lg mt-0.5"></i>
                <div><b>Mode Demo Interaktif</b><br>Gunakan user: <b>admin</b>, pass: <b>admin123</b></div>
            </div>
        </div>
    </div>

    <!-- APP VIEW -->
    <div id="appView" class="hidden h-full flex flex-col w-full max-w-md mx-auto relative bg-[#f8fafc] shadow-2xl">
        
        <!-- Header (Glass) -->
        <header class="glass px-6 py-4 flex items-center justify-between z-20 sticky top-0 shrink-0">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <img src="https://ui-avatars.com/api/?name=Admin+Keluarga&background=0ea5e9&color=fff" alt="Profile" class="w-10 h-10 rounded-full border-2 border-white shadow-md">
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-400 border-2 border-white rounded-full"></div>
                </div>
                <div>
                    <h1 class="text-sm text-slate-500 font-medium">Selamat datang,</h1>
                    <p class="text-base font-bold text-slate-900 leading-none" id="userNameDisplay">Admin</p>
                </div>
            </div>
            <button onclick="logout()" class="btn-press w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 transition shadow-sm">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto px-5 pt-4 pb-28 relative z-0" id="mainContent">
        <!-- Dynamic Content Injected Here -->
        </main>

        <!-- Bottom Navigation (Glass) -->
        <nav class="glass w-full flex justify-around pb-safe pt-4 px-2 z-20 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.05)] border-t-0 shrink-0 mt-auto">
            <button onclick="switchView('dashboard')" class="nav-btn active flex flex-col items-center p-2 text-slate-400 w-full transition-all group" data-target="dashboard">
                <div class="w-14 h-10 rounded-full flex items-center justify-center group-[.active]:bg-brand-50 transition-colors mb-1.5">
                    <i class="fa-solid fa-house text-2xl"></i>
                </div>
                <span class="text-[11px] font-medium tracking-wide">Beranda</span>
            </button>
            <button onclick="switchView('transactions')" class="nav-btn flex flex-col items-center p-2 text-slate-400 w-full transition-all group" data-target="transactions">
                <div class="w-14 h-10 rounded-full flex items-center justify-center group-[.active]:bg-brand-50 transition-colors mb-1.5">
                    <i class="fa-solid fa-list-ul text-2xl"></i>
                </div>
                <span class="text-[11px] font-medium tracking-wide">Riwayat</span>
            </button>
            <button onclick="switchView('reports')" class="nav-btn flex flex-col items-center p-2 text-slate-400 w-full transition-all group" data-target="reports">
                <div class="w-14 h-10 rounded-full flex items-center justify-center group-[.active]:bg-brand-50 transition-colors mb-1.5">
                    <i class="fa-solid fa-chart-pie text-2xl"></i>
                </div>
                <span class="text-[11px] font-medium tracking-wide">Laporan</span>
            </button>
        </nav>
        
        <!-- Interactive FAB -->
        <button onclick="openModal('tambah')" class="btn-press absolute bottom-24 right-5 w-14 h-14 bg-gradient-to-r from-brand-600 to-brand-400 text-white rounded-full shadow-[0_10px_25px_rgba(14,165,233,0.4)] flex items-center justify-center text-xl z-30 transition-transform">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <!-- TRANSACTION MODAL -->
    <div id="transactionModal" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center modal-overlay hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md shadow-2xl modal-content transform translate-y-full sm:translate-y-0 sm:scale-95 transition-transform duration-300 h-[85vh] sm:h-auto flex flex-col" id="modalContent">
            
            <!-- Drag Handle (Mobile) -->
            <div class="w-full flex justify-center pt-3 sm:hidden pb-1">
                <div class="w-12 h-1.5 bg-slate-200 rounded-full"></div>
            </div>

            <div class="px-6 py-4 flex justify-between items-center bg-white rounded-t-3xl shrink-0">
                <h3 class="text-xl font-bold text-slate-800" id="modalTitle">Transaksi Baru</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 btn-press">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <form id="transactionForm" class="px-6 pb-6 pt-2 space-y-5 overflow-y-auto flex-1">
                <input type="hidden" id="txId">
                
                <!-- Animated Toggle Switch for Type -->
                <div class="bg-slate-100 p-1.5 rounded-2xl flex relative overflow-hidden">
                    <div id="typeSlider" class="absolute top-1.5 left-1.5 w-[calc(50%-6px)] h-[calc(100%-12px)] bg-white rounded-xl shadow-sm transition-transform duration-300 ease-out z-0"></div>
                    <label class="flex-1 text-center relative z-10">
                        <input type="radio" name="jenis" value="pengeluaran" class="peer hidden" checked onchange="updateKategoriOptions()">
                        <div class="py-2.5 text-sm font-semibold text-slate-500 cursor-pointer peer-checked:text-rose-600 transition-colors flex items-center justify-center gap-2">
                            <i class="fa-solid fa-arrow-trend-down"></i> Keluar
                        </div>
                    </label>
                    <label class="flex-1 text-center relative z-10">
                        <input type="radio" name="jenis" value="pemasukan" class="peer hidden" onchange="updateKategoriOptions()">
                        <div class="py-2.5 text-sm font-semibold text-slate-500 cursor-pointer peer-checked:text-emerald-600 transition-colors flex items-center justify-center gap-2">
                            <i class="fa-solid fa-arrow-trend-up"></i> Masuk
                        </div>
                    </label>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Nominal (Rp)</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <span class="text-slate-400 font-bold text-xl">Rp</span>
                            </div>
                            <input type="text" id="txNominal" required class="block w-full pl-12 pr-4 py-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-brand-500 text-2xl font-bold text-slate-800 transition-shadow" placeholder="0" oninput="formatInputRupiah(this)" inputmode="numeric">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Tanggal</label>
                            <input type="date" id="txTanggal" required class="block w-full px-4 py-3 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-brand-500 text-sm font-medium text-slate-700">
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Kategori</label>
                            <select id="txKategori" required class="block w-full px-4 py-3 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-brand-500 text-sm font-medium text-slate-700 appearance-none">
                                <!-- Injected by JS -->
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Keterangan Catatan</label>
                        <textarea id="txKeterangan" rows="2" class="block w-full px-4 py-3 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-brand-500 text-sm text-slate-700 resize-none" placeholder="Cth: Beli bahan masakan untuk seminggu..."></textarea>
                    </div>
                </div>

                <div class="pt-4 pb-safe">
                    <button type="submit" id="btnSaveTx" class="btn-press w-full flex justify-center py-4 px-4 rounded-2xl shadow-lg shadow-brand-500/30 text-sm font-bold text-white bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-700 hover:to-brand-600 transition-all">
                        <span id="btnSaveText">Simpan Transaksi</span>
                        <i id="saveTxSpinner" class="fa-solid fa-circle-notch fa-spin ml-2 hidden mt-0.5"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[200] flex flex-col gap-3 w-full max-w-sm px-4 pointer-events-none"></div>

    <script>
        const IS_PREVIEW = false; 
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx9EzoMjxmOycr6ZjlNmrMcTNz7Est4bqf13pgunLiuVMzHqNG8XoDuY5joo3GEdFOg-w/exec"; 
        
        let state = {
            user: null,
            transactions: [],
            currentView: 'dashboard',
            chartInstance: null
        };

        const KATEGORI = {
            pemasukan: [
                { name: 'Gaji', icon: 'fa-money-bill-wave', color: 'bg-emerald-100 text-emerald-600' },
                { name: 'Bonus', icon: 'fa-gift', color: 'bg-teal-100 text-teal-600' },
                { name: 'Pinjaman Cair (Utang)', icon: 'fa-hand-holding-dollar', color: 'bg-amber-100 text-amber-600' },
                { name: 'Pencairan Investasi', icon: 'fa-seedling', color: 'bg-emerald-100 text-emerald-600' },
                { name: 'Terima Piutang', icon: 'fa-money-bill-transfer', color: 'bg-blue-100 text-blue-600' },
                { name: 'Lainnya', icon: 'fa-plus', color: 'bg-slate-100 text-slate-600' }
            ],
            pengeluaran: [
                { name: 'Makan & Dapur', icon: 'fa-utensils', color: 'bg-orange-100 text-orange-600' },
                { name: 'Tagihan', icon: 'fa-file-invoice-dollar', color: 'bg-red-100 text-red-600' },
                { name: 'Transportasi', icon: 'fa-car', color: 'bg-indigo-100 text-indigo-600' },
                { name: 'Beli Investasi', icon: 'fa-chart-pie', color: 'bg-emerald-100 text-emerald-600' },
                { name: 'Bayar Utang', icon: 'fa-credit-card', color: 'bg-rose-100 text-rose-600' },
                { name: 'Beri Pinjaman (Piutang)', icon: 'fa-handshake-angle', color: 'bg-cyan-100 text-cyan-600' },
                { name: 'Kesehatan', icon: 'fa-notes-medical', color: 'bg-rose-100 text-rose-600' },
                { name: 'Pendidikan', icon: 'fa-book', color: 'bg-cyan-100 text-cyan-600' },
                { name: 'Hiburan', icon: 'fa-gamepad', color: 'bg-purple-100 text-purple-600' },
                { name: 'Lainnya', icon: 'fa-ellipsis', color: 'bg-slate-100 text-slate-600' }
            ]
        };

        const el = {
            loginView: document.getElementById('loginView'),
            appView: document.getElementById('appView'),
            mainContent: document.getElementById('mainContent'),
            userNameDisplay: document.getElementById('userNameDisplay'),
            modal: document.getElementById('transactionModal'),
            modalContent: document.getElementById('modalContent'),
            txForm: document.getElementById('transactionForm'),
        };

        window.onload = () => {
            if (IS_PREVIEW) document.getElementById('previewNotice').classList.remove('hidden');
            
            const session = localStorage.getItem('kasku_session');
            if (session) {
                try {
                    state.user = JSON.parse(session);
                    showApp();
                } catch (e) {
                    localStorage.removeItem('kasku_session');
                }
            }
            
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            el.txForm.addEventListener('submit', saveTransaction);

            // Animate slider switch
            document.querySelectorAll('input[name="jenis"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    const slider = document.getElementById('typeSlider');
                    slider.style.transform = e.target.value === 'pemasukan' ? 'translateX(100%)' : 'translateX(0)';
                    updateKategoriOptions();
                });
            });
        };

        const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        const parseRp = (str) => parseInt(str.replace(/[^0-9]/g, ''), 10) || 0;
        
        const formatInputRupiah = (input) => {
            let val = input.value.replace(/[^0-9]/g, '');
            input.value = val ? new Intl.NumberFormat('id-ID').format(val) : '';
        };

        const getCategoryMeta = (type, name) => {
            const list = KATEGORI[type] || [];
            return list.find(k => k.name === name) || { icon: 'fa-circle', color: 'bg-slate-100 text-slate-600' };
        };

        // Animated Number Counter
        function animateValue(objId, start, end, duration) {
            const obj = document.getElementById(objId);
            if (!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeProgress = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
                const currentVal = Math.floor(easeProgress * (end - start) + start);
                obj.innerHTML = formatRp(currentVal);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const styles = type === 'success' 
                ? 'bg-emerald-600 text-white shadow-emerald-500/30' 
                : 'bg-rose-600 text-white shadow-rose-500/30';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';

            toast.className = `flex items-center p-4 rounded-2xl shadow-xl pointer-events-auto modal-enter ${styles}`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-xl mr-3"></i><span class="font-medium text-sm flex-1">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'modalEnter 0.4s ease forwards reverse';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        let mockDB = [
            { id: 'T1', tanggal: new Date().toISOString().split('T')[0], jenis_transaksi: 'pemasukan', kategori: 'Gaji', nominal: 12000000, keterangan: 'Gaji bulan ini' },
            { id: 'T2', tanggal: new Date().toISOString().split('T')[0], jenis_transaksi: 'pengeluaran', kategori: 'Makan & Dapur', nominal: 150000, keterangan: 'Belanja sayur' },
            { id: 'T3', tanggal: new Date(Date.now() - 86400000).toISOString().split('T')[0], jenis_transaksi: 'pengeluaran', kategori: 'Tagihan', nominal: 850000, keterangan: 'Listrik & Air' },
            { id: 'T4', tanggal: new Date(Date.now() - 172800000).toISOString().split('T')[0], jenis_transaksi: 'pengeluaran', kategori: 'Hiburan', nominal: 300000, keterangan: 'Nonton Bioskop' }
        ];

        async function apiCall(action, payload = {}) {
            if (IS_PREVIEW) {
                await new Promise(r => setTimeout(r, 600)); // simulate delay
                switch(action) {
                    case 'login':
                        if(payload.username === 'admin' && payload.password === 'admin123') 
                            return { status: 'success', data: { username: 'Admin' } };
                        throw new Error("Username/Password salah");
                    case 'getAll': return { status: 'success', data: [...mockDB] };
                    case 'create':
                        const newTx = { ...payload, id: 'T'+Date.now() };
                        mockDB.push(newTx); return { status: 'success' };
                    case 'update':
                        mockDB = mockDB.map(t => t.id === payload.id ? {...t, ...payload} : t);
                        return { status: 'success' };
                    case 'delete':
                        mockDB = mockDB.filter(t => t.id !== payload.id); return { status: 'success' };
                }
            }
            
            if (!GAS_URL || GAS_URL.includes("URL_GAS_DISINI")) {
                throw new Error("URL GAS belum diatur dengan benar di kode Anda.");
            }

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: action, payload: payload })
                });
                
                const textResult = await response.text();
                let result;
                try {
                    result = JSON.parse(textResult);
                } catch (e) {
                    console.error("Respons bukan JSON:", textResult);
                    throw new Error("Koneksi gagal. Pastikan Akses Web App diatur ke 'Siapa saja' (Anyone).");
                }
                
                if (result.status === 'error') {
                    throw new Error(result.message || 'Terjadi kesalahan pada server.');
                }
                
                return result;
            } catch (error) {
                console.error('API Call Error:', error);
                throw new Error(error.message || 'Gagal terhubung ke server.');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.classList.add('opacity-80', 'pointer-events-none');
            document.getElementById('loginSpinner').classList.remove('hidden');

            try {
                const res = await apiCall('login', { 
                    username: document.getElementById('username').value, 
                    password: document.getElementById('password').value 
                });
                
                if (!res || !res.data) throw new Error("Gagal menerima data akun dari server.");
                
                localStorage.setItem('kasku_session', JSON.stringify(res.data));
                state.user = res.data;
                showApp();
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.classList.remove('opacity-80', 'pointer-events-none');
                document.getElementById('loginSpinner').classList.add('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('kasku_session');
            window.location.reload();
        }

        async function showApp() {
            el.loginView.style.display = 'none';
            el.appView.classList.remove('hidden');
            el.userNameDisplay.textContent = state.user.username;
            await loadTransactions();
            switchView('dashboard');
        }

        async function loadTransactions() {
            try {
                const res = await apiCall('getAll');
                let data = (res && res.data) ? res.data : [];
                
                // Urutkan transaksi agar yang terbaru berada di urutan paling atas.
                // 1. Urutkan berdasarkan tanggal (Terbaru -> Terlama)
                // 2. Jika tanggalnya sama, urutkan berdasarkan urutan waktu input/ID (Terbaru -> Terlama)
                state.transactions = data.sort((a, b) => {
                    const timeA = new Date(a.tanggal).getTime();
                    const timeB = new Date(b.tanggal).getTime();
                    
                    if (timeB !== timeA) return timeB - timeA;
                    
                    // Fallback: ID berformat T+Timestamp, sehingga yang nilainya lebih besar adalah yang terbaru
                    return b.id.localeCompare(a.id);
                });
            } catch (e) {
                showToast(e.message || "Gagal memuat data riwayat", "error");
            }
        }

        function switchView(viewName) {
            state.currentView = viewName;
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.target === viewName);
            });

            el.mainContent.innerHTML = '';
            el.mainContent.classList.remove('slide-up');
            void el.mainContent.offsetWidth; // trigger reflow
            el.mainContent.classList.add('slide-up');

            if(viewName === 'dashboard') renderDashboard();
            else if(viewName === 'transactions') renderTransactions();
            else renderReports();
        }

        function renderDashboard() {
            let totalIn = 0, totalOut = 0;
            
            let beliInvestasi = 0, cairInvestasi = 0;
            let pinjamanCair = 0, bayarUtang = 0;
            let beriPinjaman = 0, terimaPiutang = 0;

            state.transactions.forEach(t => {
                if (t.jenis_transaksi === 'pemasukan') {
                    totalIn += t.nominal;
                    if(t.kategori === 'Pencairan Investasi') cairInvestasi += t.nominal;
                    if(t.kategori === 'Pinjaman Cair (Utang)') pinjamanCair += t.nominal;
                    if(t.kategori === 'Terima Piutang') terimaPiutang += t.nominal;
                } else {
                    totalOut += t.nominal;
                    if(t.kategori === 'Beli Investasi') beliInvestasi += t.nominal;
                    if(t.kategori === 'Bayar Utang') bayarUtang += t.nominal;
                    if(t.kategori === 'Beri Pinjaman (Piutang)') beriPinjaman += t.nominal;
                }
            });
            
            const saldo = totalIn - totalOut;
            const totalInvestasi = beliInvestasi - cairInvestasi;
            const sisaUtang = pinjamanCair - bayarUtang;
            const sisaPiutang = beriPinjaman - terimaPiutang;

            let html = `
                <!-- Balance Card -->
                <div class="bg-gradient-to-br from-blue-500 to-sky-400 rounded-[2rem] p-6 text-white mb-6 shadow-xl shadow-blue-500/30 relative overflow-hidden">
                    <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-white/10 blur-2xl"></div>
                    <div class="absolute bottom-0 left-0 -ml-8 -mb-8 w-24 h-24 rounded-full bg-white/10 blur-xl"></div>
                    
                    <div class="relative z-10 flex justify-between items-start mb-6">
                        <div>
                            <p class="text-blue-100 text-sm font-medium mb-1">Total Saldo Aktif</p>
                            <h2 class="text-4xl font-bold tracking-tight" id="saldoAnim">Rp 0</h2>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center border border-white/20 shrink-0">
                            <i class="fa-solid fa-wallet text-white text-lg"></i>
                        </div>
                    </div>

                    <div class="flex gap-4 relative z-10">
                        <div class="flex-1 bg-white/10 rounded-2xl p-3 backdrop-blur-sm border border-white/20 overflow-hidden">
                            <div class="flex items-center gap-2 mb-1 text-emerald-300">
                                <i class="fa-solid fa-circle-down text-[10px]"></i>
                                <span class="text-[10px] uppercase font-bold tracking-wider">Pemasukan</span>
                            </div>
                            <p class="font-semibold text-sm truncate">${formatRp(totalIn)}</p>
                        </div>
                        
                        <div class="flex-1 bg-white/10 rounded-2xl p-3 backdrop-blur-sm border border-white/20 overflow-hidden">
                            <div class="flex items-center gap-2 mb-1 text-rose-300">
                                <i class="fa-solid fa-circle-up text-[10px]"></i>
                                <span class="text-[10px] uppercase font-bold tracking-wider">Pengeluaran</span>
                            </div>
                            <p class="font-semibold text-sm truncate">${formatRp(totalOut)}</p>
                        </div>
                    </div>
                </div>

                <!-- Asset & Liability Cards -->
                <div class="flex gap-3 overflow-x-auto pb-4 mb-6 -mx-5 px-5 snap-x [&::-webkit-scrollbar]:hidden">
                    <div class="min-w-[110px] bg-white rounded-2xl p-4 border border-slate-100 shadow-sm flex-1 snap-center flex flex-col items-center text-center card-hover">
                        <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center mb-2">
                            <i class="fa-solid fa-seedling text-emerald-500"></i>
                        </div>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Investasi</p>
                        <p class="text-sm font-bold text-slate-800 truncate w-full">${formatRp(totalInvestasi)}</p>
                    </div>
                    
                    <div class="min-w-[110px] bg-white rounded-2xl p-4 border border-slate-100 shadow-sm flex-1 snap-center flex flex-col items-center text-center card-hover">
                        <div class="w-10 h-10 rounded-full bg-rose-50 flex items-center justify-center mb-2">
                            <i class="fa-solid fa-credit-card text-rose-500"></i>
                        </div>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Sisa Utang</p>
                        <p class="text-sm font-bold text-slate-800 truncate w-full">${formatRp(sisaUtang)}</p>
                    </div>

                    <div class="min-w-[110px] bg-white rounded-2xl p-4 border border-slate-100 shadow-sm flex-1 snap-center flex flex-col items-center text-center card-hover">
                        <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center mb-2">
                            <i class="fa-solid fa-handshake-angle text-blue-500"></i>
                        </div>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Piutang</p>
                        <p class="text-sm font-bold text-slate-800 truncate w-full">${formatRp(sisaPiutang)}</p>
                    </div>
                </div>

                <!-- Interactive Chart Area -->
                <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100 mb-8 card-hover transition-all">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-slate-800 text-sm">Visualisasi Pengeluaran</h3>
                        <span class="text-[10px] font-medium bg-slate-100 text-slate-500 px-2 py-1 rounded-lg">Semua Waktu</span>
                    </div>
                    <div class="relative h-48 w-full flex justify-center items-center">
                        ${totalOut === 0 ? '<p class="text-xs text-slate-400">Belum ada data pengeluaran</p>' : '<canvas id="expenseChart"></canvas>'}
                    </div>
                </div>

                <!-- Recent Transactions -->
                <div>
                    <div class="flex justify-between items-end mb-4 px-1">
                        <h3 class="font-bold text-slate-800 text-sm">Transaksi Terakhir</h3>
                        <button onclick="switchView('transactions')" class="text-xs text-brand-600 font-semibold hover:text-brand-700">Lihat Semua</button>
                    </div>
                    <div class="space-y-3">
            `;

            const recent = state.transactions.slice(0, 3);
            if (recent.length === 0) {
                html += `<div class="bg-white border-2 border-dashed border-slate-200 rounded-2xl p-8 text-center text-slate-400 text-sm flex flex-col items-center justify-center gap-3"><i class="fa-solid fa-receipt text-3xl opacity-50"></i>Belum ada riwayat transaksi.</div>`;
            } else {
                recent.forEach(t => html += generateTxCard(t));
            }

            html += `</div></div>`;
            el.mainContent.innerHTML = html;

            setTimeout(() => {
                animateValue("saldoAnim", 0, saldo, 1500);
                if (totalOut > 0) renderExpenseChart();
            }, 100);
        }

        function renderExpenseChart() {
            const ctx = document.getElementById('expenseChart');
            if(!ctx) return;
            
            let dataMap = {};
            state.transactions.filter(t => t.jenis_transaksi === 'pengeluaran').forEach(t => {
                dataMap[t.kategori] = (dataMap[t.kategori] || 0) + t.nominal;
            });

            const labels = Object.keys(dataMap);
            const data = Object.values(dataMap);
            const colors = ['#f43f5e', '#f97316', '#8b5cf6', '#0ea5e9', '#10b981', '#64748b'];

            if (state.chartInstance) state.chartInstance.destroy();
            
            state.chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%',
                    plugins: {
                        legend: { position: 'right', labels: { usePointStyle: true, boxWidth: 8, font: { size: 10, family: 'Poppins' } } },
                        tooltip: {
                            callbacks: { label: (ctx) => ' ' + formatRp(ctx.raw) },
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            padding: 10,
                            cornerRadius: 8,
                            titleFont: { family: 'Poppins' },
                            bodyFont: { family: 'Poppins' }
                        }
                    },
                    animation: { animateScale: true, animateRotate: true, duration: 1000, easing: 'easeOutQuart' }
                }
            });
        }

        function renderTransactions() {
            let html = `
                <div class="sticky top-0 bg-[#f8fafc] z-10 pb-4 pt-1">
                    <h2 class="text-xl font-bold text-slate-800">Riwayat Transaksi</h2>
                    <p class="text-sm text-slate-500">Semua riwayat pengeluaran dan pemasukan.</p>
                </div>
                <div class="space-y-3 pb-8">
            `; 
            
            if (state.transactions.length === 0) {
                html += `<div class="bg-white border-2 border-dashed border-slate-200 rounded-3xl p-10 text-center text-slate-400 text-sm flex flex-col items-center justify-center gap-4 mt-10"><div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center"><i class="fa-solid fa-box-open text-4xl text-slate-300"></i></div>Data riwayat kosong. Tambahkan transaksi pertamamu.</div>`;
            } else {
                state.transactions.forEach(t => html += generateTxCard(t, true));
            }
            html += `</div>`;
            el.mainContent.innerHTML = html;
        }

        function generateTxCard(t, showActions = false) {
            const isPemasukan = t.jenis_transaksi === 'pemasukan';
            const meta = getCategoryMeta(t.jenis_transaksi, t.kategori);
            const symbol = isPemasukan ? '+' : '-';
            const colorClass = isPemasukan ? 'text-emerald-600' : 'text-slate-800';
            
            const dateObj = new Date(t.tanggal);
            const dateStr = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });

            let swipeAction = '';
            if(showActions) {
                const safeData = JSON.stringify(t).replace(/"/g, '&quot;');
                swipeAction = `
                    <div class="flex gap-2 mt-3 pt-3 border-t border-slate-100">
                        <button onclick="openModal('edit', ${safeData})" class="flex-1 py-2 text-xs font-semibold text-brand-600 bg-brand-50 rounded-xl hover:bg-brand-100 transition-colors btn-press"><i class="fa-solid fa-pen mr-1"></i> Edit</button>
                        <button onclick="deleteTx('${t.id}')" class="btn-delete flex-1 py-2 text-xs font-semibold text-rose-600 bg-rose-50 rounded-xl hover:bg-rose-100 transition-colors btn-press"><i class="fa-solid fa-trash mr-1"></i> Hapus</button>
                    </div>
                `;
            }

            return `
                <div id="tx-${t.id}" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 card-hover transition-all">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 ${meta.color}">
                            <i class="fa-solid ${meta.icon} text-lg"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="text-sm font-bold text-slate-800 truncate">${t.kategori}</h4>
                            <p class="text-[11px] text-slate-500 truncate mt-0.5">${t.keterangan || 'Tidak ada catatan'}</p>
                        </div>
                        <div class="text-right shrink-0">
                            <p class="text-sm font-bold ${colorClass}">${symbol} ${formatRp(t.nominal).replace('Rp', '')}</p>
                            <p class="text-[10px] text-slate-400 font-medium mt-1">${dateStr}</p>
                        </div>
                    </div>
                    ${swipeAction}
                </div>
            `;
        }

        function renderReports(filter = 'bulan') {
            const now = new Date();
            let filteredTx = state.transactions.filter(t => {
                const d = new Date(t.tanggal);
                if (filter === 'hari') return d.toDateString() === now.toDateString();
                if (filter === 'minggu') {
                    const diff = now.getDate() - d.getDate();
                    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear() && diff >= 0 && diff < 7;
                }
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            });

            let pengeluaranMap = {};
            let totalPengeluaran = 0;
            
            filteredTx.forEach(t => {
                if(t.jenis_transaksi === 'pengeluaran') {
                    pengeluaranMap[t.kategori] = (pengeluaranMap[t.kategori] || 0) + t.nominal;
                    totalPengeluaran += t.nominal;
                }
            });

            const getBtnClass = (type) => filter === type 
                ? 'bg-brand-500 text-white shadow-md' 
                : 'bg-white text-slate-500 hover:bg-slate-50';

            let html = `
                <div class="sticky top-0 bg-[#f8fafc] z-10 pb-4 pt-1">
                    <h2 class="text-xl font-bold text-slate-800 mb-4">Laporan Keuangan</h2>
                    <div class="flex p-1 bg-slate-200/50 rounded-2xl backdrop-blur-md">
                        <button onclick="renderReports('hari')" class="flex-1 py-2 text-xs font-semibold rounded-xl transition-all ${getBtnClass('hari')}">Hari Ini</button>
                        <button onclick="renderReports('minggu')" class="flex-1 py-2 text-xs font-semibold rounded-xl transition-all ${getBtnClass('minggu')}">7 Hari</button>
                        <button onclick="renderReports('bulan')" class="flex-1 py-2 text-xs font-semibold rounded-xl transition-all ${getBtnClass('bulan')}">Bulan Ini</button>
                    </div>
                </div>

                <div class="bg-rose-50 border border-rose-100 p-6 rounded-[2rem] text-center mb-6 mt-2">
                    <p class="text-xs font-bold text-rose-500 uppercase tracking-widest mb-2">Total Pengeluaran</p>
                    <h2 class="text-3xl font-bold text-rose-600">${formatRp(totalPengeluaran)}</h2>
                </div>
                
                <h3 class="text-sm font-bold text-slate-800 mb-4 px-2">Rincian Pengeluaran</h3>
                <div class="space-y-4 pb-8">
            `;

            if(Object.keys(pengeluaranMap).length === 0) {
                html += `<div class="text-center py-10 text-slate-400 text-sm bg-white rounded-[2rem] border border-slate-100 shadow-sm">Tidak ada pengeluaran pada periode ini.</div>`;
            } else {
                const sorted = Object.entries(pengeluaranMap).sort((a,b) => b[1] - a[1]);
                sorted.forEach(([kat, nom], index) => {
                    let percent = Math.round((nom / totalPengeluaran) * 100);
                    const meta = getCategoryMeta('pengeluaran', kat);
                    html += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 fade-in" style="animation-delay: ${index * 0.1}s; opacity:0;">
                            <div class="flex justify-between items-center mb-3">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full ${meta.color} flex items-center justify-center text-xs"><i class="fa-solid ${meta.icon}"></i></div>
                                    <span class="text-sm font-bold text-slate-700">${kat}</span>
                                </div>
                                <span class="text-sm font-bold text-slate-900">${formatRp(nom)}</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                                <div class="bg-gradient-to-r from-rose-400 to-rose-500 h-full rounded-full transition-all duration-1000 ease-out" style="width: 0%" data-target-width="${percent}%"></div>
                            </div>
                            <p class="text-right text-[10px] font-medium text-slate-400 mt-1.5">${percent}% dari total</p>
                        </div>
                    `;
                });
            }

            html += `</div>`;
            el.mainContent.innerHTML = html;

            setTimeout(() => {
                document.querySelectorAll('[data-target-width]').forEach(bar => {
                    bar.style.width = bar.dataset.targetWidth;
                });
            }, 100);
        }

        function updateKategoriOptions() {
            const jenis = document.querySelector('input[name="jenis"]:checked').value;
            const select = document.getElementById('txKategori');
            select.innerHTML = '';
            KATEGORI[jenis].forEach(kat => {
                select.innerHTML += `<option value="${kat.name}">${kat.name}</option>`;
            });
        }

        function openModal(mode, data = null) {
            el.modal.classList.remove('hidden');
            void el.modal.offsetWidth;
            el.modal.classList.remove('opacity-0');
            el.modalContent.classList.remove('translate-y-full', 'sm:scale-95');

            if (mode === 'tambah') {
                document.getElementById('modalTitle').textContent = 'Transaksi Baru';
                document.getElementById('btnSaveText').textContent = 'Simpan Transaksi';
                el.txForm.reset();
                document.getElementById('txId').value = '';
                document.getElementById('txTanggal').value = new Date().toISOString().split('T')[0];
                document.querySelector('input[name="jenis"][value="pengeluaran"]').checked = true;
                document.getElementById('typeSlider').style.transform = 'translateX(0)';
                updateKategoriOptions();
            } else if (mode === 'edit' && data) {
                document.getElementById('modalTitle').textContent = 'Edit Transaksi';
                document.getElementById('btnSaveText').textContent = 'Perbarui Data';
                document.getElementById('txId').value = data.id;
                document.getElementById('txTanggal').value = data.tanggal;
                
                const radio = document.querySelector(`input[name="jenis"][value="${data.jenis_transaksi}"]`);
                radio.checked = true;
                document.getElementById('typeSlider').style.transform = data.jenis_transaksi === 'pemasukan' ? 'translateX(100%)' : 'translateX(0)';
                
                updateKategoriOptions();
                document.getElementById('txKategori').value = data.kategori;
                document.getElementById('txNominal').value = new Intl.NumberFormat('id-ID').format(data.nominal);
                document.getElementById('txKeterangan').value = data.keterangan || '';
            }
        }

        function closeModal() {
            el.modal.classList.add('opacity-0');
            el.modalContent.classList.add('translate-y-full', 'sm:scale-95');
            setTimeout(() => { el.modal.classList.add('hidden'); }, 300);
        }

        async function saveTransaction(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSaveTx');
            const spinner = document.getElementById('saveTxSpinner');
            btn.classList.add('opacity-80', 'pointer-events-none');
            spinner.classList.remove('hidden');

            const payload = {
                id: document.getElementById('txId').value,
                tanggal: document.getElementById('txTanggal').value,
                jenis_transaksi: document.querySelector('input[name="jenis"]:checked').value,
                kategori: document.getElementById('txKategori').value,
                nominal: parseRp(document.getElementById('txNominal').value),
                keterangan: document.getElementById('txKeterangan').value
            };

            try {
                const action = payload.id ? 'update' : 'create';
                if(!payload.id) delete payload.id;
                
                await apiCall(action, payload);
                showToast(action === 'create' ? "Berhasil dicatat!" : "Data diperbarui!");
                closeModal();
                await loadTransactions();
                switchView(state.currentView);
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.classList.remove('opacity-80', 'pointer-events-none');
                spinner.classList.add('hidden');
            }
        }

        async function deleteTx(id) {
            const elCard = document.getElementById(`tx-${id}`);
            const btn = elCard.querySelector('.btn-delete');
            const originalText = btn.innerHTML;

            if(btn.dataset.confirm !== "true") {
                btn.dataset.confirm = "true";
                btn.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Yakin?`;
                btn.classList.replace('bg-rose-50', 'bg-rose-600');
                btn.classList.replace('text-rose-600', 'text-white');
                setTimeout(() => {
                    if(btn) {
                        btn.dataset.confirm = "false";
                        btn.innerHTML = originalText;
                        btn.classList.replace('bg-rose-600', 'bg-rose-50');
                        btn.classList.replace('text-white', 'text-rose-600');
                    }
                }, 3000);
                return;
            }

            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i>`;
            try {
                await apiCall('delete', { id });
                elCard.style.transform = 'translateX(-100%)';
                elCard.style.opacity = '0';
                setTimeout(async () => {
                    await loadTransactions();
                    switchView(state.currentView);
                    showToast("Data dihapus");
                }, 300);
            } catch (err) {
                showToast("Gagal menghapus", 'error');
                btn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>
